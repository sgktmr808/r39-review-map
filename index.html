<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R39 レビューマップ</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--add:#3fb950;--fix:#f0883e;--sel:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;height:100vh;overflow:hidden}
#left{flex:1;min-width:0;display:flex;flex-direction:column}
#right{width:380px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
/* gap は Safari 14.1 未満の flexbox で効かず、チェックボックスと文字が重なる。margin で組む */
#bar{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;font-size:12px;line-height:1.9}
#bar>*{margin-right:14px}
#bar label{display:inline-flex;align-items:center;color:var(--dim);cursor:pointer;white-space:nowrap;margin-right:12px}
#bar label:last-child{margin-right:0}
#bar input[type=checkbox]{margin:0 6px 0 0;flex:0 0 auto;width:14px;height:14px}
#bar input[type=range]{margin-left:6px;vertical-align:middle}
#toggles{display:inline-flex;flex-wrap:wrap;align-items:center}
#wrap{flex:1;overflow:auto;background:#05070a}
canvas{display:block;cursor:crosshair}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:600}
textarea,input,select{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
textarea{resize:vertical;min-height:52px}
button{border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;color:#08131f}
.badd{background:var(--add)} .bfix{background:var(--fix)} .bexp{background:var(--sel);width:100%}
.row{display:flex;align-items:center;margin-top:6px}
.row>*{margin-right:6px}
.row>*:last-child{margin-right:0}
#cells{font-family:ui-monospace,monospace;color:var(--sel);min-height:20px;word-break:break-all}
#list{flex:1;overflow:auto;padding:8px 12px}
.rev{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:8px;margin-bottom:8px;font-size:12px}
.rev.add{border-left-color:var(--add)} .rev.fix{border-left-color:var(--fix)}
.rev b{display:block} .rev .m{color:var(--dim);font-family:ui-monospace,monospace;font-size:11px}
.rev button{background:#30363d;color:var(--fg);float:right;padding:2px 8px;font-size:11px}
#hint{color:var(--dim);font-size:11px;padding:0 12px 10px}

/* ================= iPhone / タッチ端末 ================= *
 * 幅 402px の縦画面に地図全体(4789px / 20 区画)を入れると 1 区画が 20px になり、
 * Apple の最小タップ目標 44pt を満たせない。**指で直接タップするのは原理的に無理**なので、
 * 画面中央に照準を固定し、地図の側を動かして合わせる方式にする(ユーザー選択)。
 * フォームは iOS 標準の bottom sheet(peek / half / full の 3 段)。
 * レイヤーは ≡ で別シートへ出し、地図の面積を最大に使う。 */
#xhair,#menu,#sheetTop,#layersheet{display:none}
@media (max-width:860px),(pointer:coarse){
  body{display:block;height:100dvh;overflow:hidden}
  #left{height:100dvh;display:flex;flex-direction:column;position:relative}
  #bar{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;flex-wrap:nowrap;overflow:hidden}
  #bar #meta,#bar label,#bar #toggles{display:none}
  #bar #menu{display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;margin:0 0 0 auto;background:#21262d;color:var(--fg);border-radius:10px;font-size:20px}
  #wrap{flex:1;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}
  /* 照準。地図の上に固定し、地図の側をドラッグして合わせる */
  /* 照準は #wrap の**外**に置く。中に置くと overflow:auto の内容(1916px)に対する
     50% になり、画面中央からずれる(実測で確認)。位置は JS が見える枠から決める */
  #xhair{display:block;position:absolute;transform:translate(-50%,-50%);
    width:64px;height:64px;pointer-events:none;z-index:5}
  #xhair::before,#xhair::after{content:"";position:absolute;background:#58a6ff;box-shadow:0 0 0 1px rgba(5,7,10,.8)}
  #xhair::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
  #xhair::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
  #xring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:34px;height:34px;border:2px solid #58a6ff;border-radius:50%;box-shadow:0 0 0 1px rgba(5,7,10,.8)}
  /* 下から引き上げるシート */
  /*
   * シートは **1 本のスクロール**にする。内側の #list だけをスクロールにすると、
   * 中身の合計(掴み手 + 選択 + 追加 + 修正 + 一覧 + 書き出し)が 86dvh を超えたぶんが
   * 届かなくなる(実測: 書き出しボタンまで到達できなかった)。
   */
  #right{--peek:148px;position:fixed;left:0;right:0;bottom:0;width:auto;height:86dvh;
    border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(calc(86dvh - var(--peek,148px)));
    transition:transform .22s cubic-bezier(.32,.72,0,1);z-index:20;
    display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(env(safe-area-inset-bottom) + 28px);box-shadow:0 -8px 28px rgba(0,0,0,.5)}
  /* 掴み手と照準行は上に貼り付けておく(スクロールしても選択を続けられる) */
  #sheetTop{position:sticky;top:0;background:var(--panel);z-index:2}
  #right .sec{flex:none}
  #list{flex:none;max-height:none;overflow:visible}
  #right[data-detent="half"]{transform:translateY(48dvh)}
  #right[data-detent="full"]{transform:translateY(0)}
  #sheetTop{display:block;padding:6px 12px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #grab{width:40px;height:5px;border-radius:3px;background:#484f58;margin:0 auto 10px}
  #aimrow{display:flex;align-items:center}
  #aim{font-family:ui-monospace,monospace;font-size:22px;color:var(--sel);min-width:56px;font-weight:700}
  #aimlab{color:var(--dim);font-size:11px;margin-right:8px}
  #aimadd{flex:1;height:44px;background:var(--sel);color:#08131f;font-size:15px}
  #right .sec:first-of-type #hint{display:none}
  /* レイヤーの別シート */
  #layersheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 28px rgba(0,0,0,.5)}
  #layersheet[data-open="1"]{transform:translateY(0)}
  #layersheet h2{margin:6px 0 10px;font-size:12px;letter-spacing:.08em;color:var(--dim)}
  #layersheet label{display:flex;align-items:center;min-height:44px;color:var(--fg);border-bottom:1px solid #21262d}
  #layersheet input[type=checkbox]{width:20px;height:20px;margin:0 12px 0 0}
  #layersheet .zoomrow{display:flex;align-items:center;min-height:52px}
  #layersheet input[type=range]{flex:1;margin-left:12px;height:32px}
  #lclose{width:100%;height:44px;margin-top:10px;background:#30363d;color:var(--fg)}
  textarea{min-height:64px;font-size:16px}   /* 16px 未満は iOS が自動ズームする */
  input,select{font-size:16px;min-height:44px}
  button{min-height:44px}
}
</style></head><body>
<div id="left">
<div id="bar">
    <b style="color:var(--fg)">R39 レビューマップ</b>
    <span id="meta" style="color:var(--dim)"></span>
    <span style="flex:1"></span>
    <label><input type="checkbox" id="lgrid" checked>格子</label>
    <label id="proplab" style="display:none"><input type="checkbox" id="lprop">提案を見る</label>
    <span id="toggles"></span>
    <label>拡大<input type="range" id="zoom" min="8" max="300" value="60" style="width:90px"></label>
    <button id="menu" aria-label="レイヤー">≡</button>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="xhair"><div id="xring"></div></div>
</div>
<div id="right" data-detent="peek">
<div id="sheetTop">
  <div id="grab"></div>
  <div id="aimrow">
    <span id="aimlab">照準</span><span id="aim">—</span>
    <button id="aimadd">＋ 選択に追加</button>
  </div>
</div>
<div class="sec">
    <h2>選択中の区画</h2>
    <div id="cells">未選択</div>
    <div id="hint" style="padding:6px 0 0">クリックで選択 / もう一度で解除 / 何区画でも選べます</div>
    <div class="row"><button class="bexp" id="clearsel" style="background:#30363d;color:var(--fg)">選択を解除</button></div>
</div>
<div class="sec">
    <h2>追加実装レビュー</h2>
    <input id="atitle" placeholder="例: D3 にヨットハーバーを実装">
    <textarea id="abody" placeholder="どう作ってほしいか。参考にする実例があれば書いてください"></textarea>
    <div class="row"><select id="apri"><option value="high">優先 高</option><option value="mid" selected>優先 中</option><option value="low">優先 低</option></select>
    <button class="badd" id="aadd">追加として登録</button></div>
</div>
<div class="sec">
    <h2>修正レビュー</h2>
    <input id="ftitle" placeholder="例: H6 の環状水路が広すぎる">
    <textarea id="fbody" placeholder="何がどうおかしいか。どうなってほしいか"></textarea>
    <div class="row"><select id="fpri"><option value="high">優先 高</option><option value="mid" selected>優先 中</option><option value="low">優先 低</option></select>
    <button class="bfix" id="fadd">修正として登録</button></div>
</div>
<div id="list"></div>
<div class="sec"><button class="bexp" id="exp">レビューをファイルへ書き出す</button></div>
</div>
<div id="layersheet">
  <h2>表示レイヤー</h2>
  <div id="msheet"></div>
  <div class="zoomrow"><span style="color:var(--dim)">拡大</span><input type="range" id="mzoom" min="8" max="300" value="60"></div>
  <button id="lclose">閉じる</button>
</div>
<script>
const S={man:null,img:null,imgProp:null,sel:new Set(),revs:[],layers:{}};
/* タッチ端末か。照準方式・シート・レイヤーシートはこのときだけ有効にする */
const MOBILE=window.matchMedia("(max-width:860px),(pointer:coarse)").matches;
const KINDLABEL={city:"都市",district:"地区",mountain:"山",port:"港","rail-station":"鉄道駅","metro-station":"地下鉄駅",landmark:"ランドマーク",river:"河川",marina:"ハーバー"};
const KINDCOL={city:"#58d3ff",district:"#7fb6dc",mountain:"#ff6a5a",port:"#ffc846",'rail-station':"#fa8038","metro-station":"#be6ef0",landmark:"#ffe08a",river:"#6ea8fa",marina:"#ff8cdc"};
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
function cell(u,v){const g=S.man.grid,m=S.man.map;
const c=Math.min(g.cols-1,Math.max(0,Math.floor(u/g.cellWidthM))),r=Math.min(g.rows-1,Math.max(0,Math.floor(v/g.cellHeightM)));
return String.fromCharCode(65+c)+(r+1);}
function cellRect(id){const g=S.man.grid;const c=id.charCodeAt(0)-65,r=parseInt(id.slice(1),10)-1;
return {x:c*g.cellWidthM,y:r*g.cellHeightM,w:g.cellWidthM,h:g.cellHeightM};}
function draw(){
const z=+document.getElementById("zoom").value/100, m=S.man.map;
cv.width=Math.round(m.widthPx*z); cv.height=Math.round(m.heightPx*z);
cx.imageSmoothingEnabled=true;
const useProp=S.imgProp&&document.getElementById("lprop")&&document.getElementById("lprop").checked;
cx.drawImage(useProp?S.imgProp:S.img,0,0,cv.width,cv.height);
const s=cv.width/m.widthM;                       // px per meter
if(document.getElementById("lgrid").checked){
    const g=S.man.grid;
    cx.strokeStyle="rgba(230,237,243,.35)";cx.lineWidth=1;cx.font=(11)+"px ui-monospace,monospace";cx.fillStyle="rgba(230,237,243,.55)";
    for(let c=0;c<=g.cols;c++){const x=c*g.cellWidthM*s;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();}
    for(let r=0;r<=g.rows;r++){const y=r*g.cellHeightM*s;cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();}
    for(let c=0;c<g.cols;c++)for(let r=0;r<g.rows;r++){
      cx.fillText(String.fromCharCode(65+c)+(r+1),(c+.5)*g.cellWidthM*s-11,(r+.5)*g.cellHeightM*s+4);}
}
for(const id of S.sel){const q=cellRect(id);
    cx.fillStyle="rgba(88,166,255,.28)";cx.fillRect(q.x*s,q.y*s,q.w*s,q.h*s);
    cx.strokeStyle="#58a6ff";cx.lineWidth=3;cx.strokeRect(q.x*s,q.y*s,q.w*s,q.h*s);}
for(const f of S.man.features){
    if(!S.layers[f.kind]) continue;
    const x=f.u*s,y=f.v*s,rr=f.kind==="city"?7:f.kind==="district"?5:4;
    cx.beginPath();cx.arc(x,y,rr,0,7);cx.fillStyle=KINDCOL[f.kind]||"#fff";cx.fill();
    cx.lineWidth=1.5;cx.strokeStyle="rgba(5,7,10,.85)";cx.stroke();
    if(z>0.8&&(f.kind==="city"||f.kind==="mountain"||f.kind==="marina")){
      cx.fillStyle="#e6edf3";cx.font="11px sans-serif";cx.fillText(f.label,x+9,y+4);}
}
}
cv.addEventListener("click",e=>{
if(MOBILE)return;                                   /* タッチ端末は照準で選ぶ(指が目標を隠すため) */
const b=cv.getBoundingClientRect(),m=S.man.map,s=cv.width/m.widthM;
const u=(e.clientX-b.left)*(cv.width/b.width)/s, v=(e.clientY-b.top)*(cv.height/b.height)/s;
const id=cell(u,v); if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);
renderSel();draw();
});

/* ================= タッチ端末の操作 ================= */
const wrap=document.getElementById("wrap");
/**
 * 照準の位置。シートが下端 148px を覆うので、**覆われていない領域の中心**へ置く。
 * 表示(#xhair)と判定(aimedCell)は必ず同じ点を使う。
 */
function aimPoint(){
  const peek=parseFloat(getComputedStyle(document.getElementById("right")).getPropertyValue("--peek"))||148;
  return {x:wrap.clientWidth/2, y:Math.max(60,(wrap.clientHeight-peek)/2)};
}
function placeXhair(){
  if(!MOBILE)return;
  const a=aimPoint(),x=document.getElementById("xhair");
  x.style.left=(wrap.offsetLeft+a.x)+"px";
  x.style.top =(wrap.offsetTop +a.y)+"px";
}
/** 照準の真下にある区画 */
function aimedCell(){
  const m=S.man.map,s=cv.width/m.widthM,a=aimPoint();
  const u=(wrap.scrollLeft+a.x)/s, v=(wrap.scrollTop+a.y)/s;
  return cell(u,v);
}
function renderAim(){
  if(!MOBILE)return;
  const id=aimedCell();
  document.getElementById("aim").textContent=id;
  const on=S.sel.has(id);
  const b=document.getElementById("aimadd");
  b.textContent=(on?"− ":"＋ ")+id+(on?" を選択から外す":" を選択に追加");
  b.style.background=on?"#30363d":"var(--sel)";
  b.style.color=on?"var(--fg)":"#08131f";
}
if(MOBILE){
  placeXhair();
  window.addEventListener("resize",()=>{placeXhair();renderAim();},{passive:true});
  wrap.addEventListener("scroll",renderAim,{passive:true});
  document.getElementById("aimadd").onclick=()=>{
    const id=aimedCell(); if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);
    renderSel();draw();renderAim();
  };
  /* ---- ピンチ拡大。中心を保ったまま zoom を変え、scroll で位置を戻す ---- */
  let pinch=null;
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  wrap.addEventListener("touchstart",e=>{
    if(e.touches.length!==2)return;
    const z=+document.getElementById("zoom").value;
    const a=aimPoint();
    pinch={d:dist(e.touches),z:z,
      cx:(wrap.scrollLeft+a.x)/cv.width,
      cy:(wrap.scrollTop+a.y)/cv.height};
  },{passive:false});
  wrap.addEventListener("touchmove",e=>{
    if(!pinch||e.touches.length!==2)return;
    e.preventDefault();
    const k=dist(e.touches)/pinch.d;
    const z=Math.max(8,Math.min(300,Math.round(pinch.z*k)));
    const el=document.getElementById("zoom");
    if(z===+el.value)return;
    el.value=String(z);document.getElementById("mzoom").value=String(z);
    draw();
    const a2=aimPoint();
    wrap.scrollLeft=pinch.cx*cv.width-a2.x;
    wrap.scrollTop =pinch.cy*cv.height-a2.y;
    renderAim();
  },{passive:false});
  wrap.addEventListener("touchend",()=>{pinch=null;},{passive:true});

  /* ---- シートの 3 段(peek / half / full)。掴み手をドラッグ、またはタップで循環 ---- */
  const sheet=document.getElementById("right"),grab=document.getElementById("grab");
  const DET=["peek","half","full"];
  const setDetent=(d)=>{sheet.dataset.detent=d;};
  let drag=null;
  const onDown=(y)=>{drag={y:y,d:sheet.dataset.detent,moved:false};};
  const onMove=(y)=>{ if(!drag)return; const dy=y-drag.y; if(Math.abs(dy)>8)drag.moved=true;
    if(Math.abs(dy)<28)return;
    const i=DET.indexOf(drag.d), ni=Math.max(0,Math.min(2,i+(dy<0?1:-1)));
    setDetent(DET[ni]); drag.y=y; drag.d=DET[ni];};
  const onUp=()=>{ if(drag&&!drag.moved){const i=DET.indexOf(sheet.dataset.detent);setDetent(DET[(i+1)%3]);} drag=null;};
  grab.addEventListener("touchstart",e=>onDown(e.touches[0].clientY),{passive:true});
  grab.addEventListener("touchmove",e=>onMove(e.touches[0].clientY),{passive:true});
  grab.addEventListener("touchend",onUp,{passive:true});
  document.getElementById("sheetTop").addEventListener("click",e=>{ if(e.target.id==="grab"||e.target.id==="sheetTop")return; });

  /* ---- レイヤーの別シート ---- */
  const ls=document.getElementById("layersheet");
  document.getElementById("menu").onclick=()=>{ls.dataset.open=ls.dataset.open==="1"?"0":"1";};
  document.getElementById("lclose").onclick=()=>{ls.dataset.open="0";};
  document.getElementById("mzoom").oninput=()=>{
    document.getElementById("zoom").value=document.getElementById("mzoom").value;draw();renderAim();};
}
function renderSel(){const a=[...S.sel].sort();document.getElementById("cells").textContent=a.length?a.join(" , "):"未選択";
if(MOBILE&&document.getElementById("aim").textContent!=="—")renderAim();}
function here(){ /* 選択区画の中心の緯度経度(代表点) */
const a=[...S.sel];if(!a.length)return null;const q=cellRect(a[0]);
const u=q.x+q.w/2,v=q.y+q.h/2,p=S.man.projection,R=S.man.world.radiusM;
const lat=((p.halfWidthM/2-v)/R)*180/Math.PI;
let lon=(p.aX-(u-p.halfWidthM))/R; while(lon<=-Math.PI)lon+=2*Math.PI; while(lon>Math.PI)lon-=2*Math.PI;
return {lat:+lat.toFixed(3),lon:+(lon*180/Math.PI).toFixed(3)};
}
function add(kind){
const t=document.getElementById(kind==="add"?"atitle":"ftitle"),b=document.getElementById(kind==="add"?"abody":"fbody"),p=document.getElementById(kind==="add"?"apri":"fpri");
if(!S.sel.size){alert("区画を選んでください");return;}
if(!t.value.trim()){alert("見出しを書いてください");return;}
S.revs.push({id:S.revs.length+1,kind,priority:p.value,cells:[...S.sel].sort(),point:here(),
    inCells:S.man.features.filter(f=>S.sel.has(f.cell)).map(f=>f.id),
    title:t.value.trim(),body:b.value.trim()});
t.value="";b.value="";save();renderList();
}
function renderList(){
const el=document.getElementById("list");
el.innerHTML=S.revs.length?"":'<div style="color:var(--dim);font-size:12px">まだ登録がありません</div>';
for(const r of S.revs){
    const d=document.createElement("div");d.className="rev "+r.kind;
    d.innerHTML='<button data-id="'+r.id+'">削除</button><b>'+(r.kind==="add"?"追加":"修正")+" / "+r.priority+" — "+esc(r.title)+'</b><div class="m">'+r.cells.join(",")+'</div>'+(r.body?'<div>'+esc(r.body)+'</div>':"");
    el.appendChild(d);
}
el.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.revs=S.revs.filter(x=>x.id!=b.dataset.id);save();renderList();});
}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const save=()=>localStorage.setItem("r39revs",JSON.stringify(S.revs));
document.getElementById("exp").onclick=()=>{
const out={schema:"r39-review/1",world:S.man.world,mapGrid:S.man.grid,
    exportedAtIso:new Date().toISOString(),reviewCount:S.revs.length,reviews:S.revs};
const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);
a.download="r39-review-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".json";
document.body.appendChild(a);a.click();a.remove();
};
document.getElementById("aadd").onclick=()=>add("add");
document.getElementById("fadd").onclick=()=>add("fix");
document.getElementById("clearsel").onclick=()=>{S.sel.clear();renderSel();draw();};
document.getElementById("zoom").oninput=draw;
document.getElementById("lgrid").onchange=draw;
(async()=>{
/*
 * Safari は map.png を強くキャッシュする。**map.png の中身の hash** を query に付けて、
 * 書き直したら必ず取り直させる。以前は generatedAtIso を付けていたが、あれは決定論のため
 * 固定値なので cache buster にならず、古い地図が残った(「地図が真っ黒」の原因)。
 */
S.man=await (await fetch("manifest.json?v="+Date.now())).json();
S.img=new Image();S.img.src="map.png?v="+encodeURIComponent(S.man.mapSha||S.man.generatedAtIso||"");
try{await S.img.decode();}catch(e){
    /* 落ちたまま先へ進むと canvas が黒いだけの画面になる。何が起きたかを出す */
    document.body.insertAdjacentHTML("afterbegin",
        '<div style="padding:12px;background:#511;color:#fdd;font:14px system-ui">'
        +'map.png を読めませんでした(キャッシュが壊れているか通信が切れています)。'
        +'ページを強制再読み込み(Shift+更新)してください。<br>'+String(e)+'</div>');
    throw e;
}
/* 提案版があれば「提案を見る」を出す。まだ世界へは入れていない案の見え方 */
try{
    const ip=new Image();ip.src="map-proposal.png?v="+encodeURIComponent(S.man.mapSha||"");await ip.decode();
    S.imgProp=ip;
    document.getElementById("proplab").style.display="";
    document.getElementById("lprop").onchange=draw;
}catch(e){/* 提案版が無い世界もある */}
for(const k of S.man.featureKinds)S.layers[k]=true;
document.getElementById("toggles").innerHTML=S.man.featureKinds.map(k=>
    '<label><input type="checkbox" data-k="'+k+'" checked>'+(KINDLABEL[k]||k)+'</label>').join("");
document.querySelectorAll('#toggles input').forEach(i=>i.onchange=()=>{S.layers[i.dataset.k]=i.checked;draw();});
document.getElementById("meta").textContent=
    S.man.grid.cols+"x"+S.man.grid.rows+" / 1 区画 "+S.man.grid.cellWidthM.toFixed(0)+"m / 世界 "+S.man.world.radiusM+"m / seed "+S.man.world.seed;
try{S.revs=JSON.parse(localStorage.getItem("r39revs")||"[]")}catch(e){S.revs=[]}
if(MOBILE){
    /*
     * 既定の拡大率。区画は元画像で 239px なので、44pt(Apple の最小タップ目標)を満たすには
     * 18% 以上。読みやすさと視野(画面に何区画入るか)の兼ね合いで 40% を既定にする
     * (1 区画 96px / 画面に横 4.2 区画)。全体を見たいときはピンチで 8% まで引ける。
     */
    document.getElementById("zoom").value="40";
    document.getElementById("mzoom").value="40";
    /* レイヤーはヘッダーではなく ≡ の別シートへ出す(地図の面積を最大に使う) */
    document.getElementById("msheet").innerHTML=
      '<label><input type="checkbox" id="mgrid" checked>格子</label>'
      +(S.imgProp?'<label><input type="checkbox" id="mprop">提案を見る</label>':'')
      +S.man.featureKinds.map(k=>'<label><input type="checkbox" data-mk="'+k+'" checked>'+(KINDLABEL[k]||k)+'</label>').join("");
    document.getElementById("mgrid").onchange=e=>{document.getElementById("lgrid").checked=e.target.checked;draw();};
    if(S.imgProp)document.getElementById("mprop").onchange=e=>{document.getElementById("lprop").checked=e.target.checked;draw();};
    document.querySelectorAll('#msheet input[data-mk]').forEach(i=>i.onchange=()=>{S.layers[i.dataset.mk]=i.checked;draw();});
}
renderSel();renderList();draw();
if(MOBILE){
    /* 島(city3)を初期表示にする。全体表示は 1 区画 20px でタップできないので中心を寄せる */
    const g=S.man.grid,m=S.man.map,sc=cv.width/m.widthM;
    const a0=aimPoint();
    wrap.scrollLeft=Math.max(0,(3.0*g.cellWidthM)*sc-a0.x);
    wrap.scrollTop =Math.max(0,(4.5*g.cellHeightM)*sc-a0.y);
    placeXhair();renderAim();
}
})();
</script></body></html>
